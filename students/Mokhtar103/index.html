<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Mohamed Mokhtar | Mini Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="profile">
            <h1>Ahmed Mohamed</h1>

            <p class="username">@Mokhtar103</p>

            <p class="track">
                Learning Track: .NET Backend Development
            </p>

            <div class="links">
                <a href="https://github.com/Mokhtar103" target="_blank">
                    GitHub Profile
                </a>

                <a href="https://github.com/Mokhtar103/Calculator" target="_blank">
                    Calculator Repository
                </a>

                <a href="https://www.linkedin.com/in/ahmed-mokhtar23/" target="_blank">
                    LinkedIn
                </a>
            </div>
        </section>


        <section class="calculator">

            <div class="display" id="display">
                0
            </div>

            <div class="buttons">

                <button class="clear" data-action="clear">AC</button>
                <button data-action="delete">DEL</button>
                <button data-operator="/">÷</button>
                <button data-operator="*">×</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button data-operator="-">−</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button data-operator="+">+</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="equals" data-action="calculate">=</button>

                <button class="zero" data-number="0">0</button>
                <button data-number=".">.</button>

            </div>

        </section>

        <footer>
            <p>Copyrights &copy; 2026 Mokhtar103. All rights reserved.</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
