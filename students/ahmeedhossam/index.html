<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed HossamAldin Hamdy - .NET Developer</title>

    <!-- Internal CSS for a clean, professional look without needing a separate file -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .profile-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

            .profile-card h1 {
                color: #512bd4; /* Official .NET Purple */
                margin-bottom: 5px;
                font-size: 1.8rem;
            }

            .profile-card h2 {
                color: #666;
                font-size: 1.1rem;
                margin-top: 0;
                margin-bottom: 25px;
                font-weight: 500;
            }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Base button styles */
        .btn {
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }

            .btn:hover {
                transform: translateY(-2px);
                opacity: 0.9;
            }
        /* Specific button colors */
        .btn-calc {
            background-color: #107c41;
        }
        /* Green */
        .btn-github {
            background-color: #24292e;
        }
        /* GitHub Black */
        .btn-linkedin {
            background-color: #0077b5;
        }
        /* LinkedIn Blue */
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>Ahmed HossamAldin Hamdy</h1>
        <h2>Software Engineer | .NET Track</h2>

        <div class="links-container">
            <!-- Calculator Repository Link -->
            <a href="https://github.com/Ahmeedhossam/Ahmeedhossam-Assignment2" target="_blank" class="btn btn-calc">
                🧮 Calculator Repository
            </a>

            <!-- GitHub Profile Link -->
            <a href="https://github.com/Ahmeedhossam" target="_blank" class="btn btn-github">
                🐙 GitHub Profile
            </a>

            <!-- LinkedIn Profile Link -->
            <a href="https://www.linkedin.com/in/ahmedhossam74/" target="_blank" class="btn btn-linkedin">
                💼 LinkedIn Profile
            </a>
        </div>
    </div>
</body>
</html>
