<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Assem // Backend Engineer</title>
    <link rel="stylesheet" href="style.css">
  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div class="space-bg"></div> 

    <div class="main-wrapper">
        <main class="portfolio-card">
            
            <header class="card-header">
                <div class="avatar-wrapper">
                    <div class="avatar-terminal">./MA</div>
                    <div class="status-pulse"></div>
                </div>
                <div class="identity">
                    <h1 class="glitch" data-text="Mohamed Assem">Mohamed Assem</h1>
                    <p class="subtitle"><i class="devicon-dotnetcore-plain"></i>Software Engineer</p>
                    <p class="subtitle"><i class="devicon-dotnetcore-plain"></i> Backend .NET Engineer</p>
                </div>
            </header>

            <section class="core-section">
                <div class="section-tag">// Featured_Artifact</div>
                <a href="https://github.com/judge22/calculator" target="_blank" class="artifact-box">
                    <div class="artifact-icon"><i class="fa-solid fa-code-branch"></i></div>
                    <div class="artifact-details">
                        <h3>MODERN_CALCULATOR_CORE</h3>
                        <p>Vanilla JS Logic // Responsive System</p>
                    </div>
                    <div class="deploy-status">deployed</div>
                </a>
            </section>

            <section class="core-section">
                <div class="section-tag">// Network_Protocols</div>
                <div class="protocol-grid">
                    <a href="https://github.com/judge22" target="_blank" class="protocol-link" data-tool="GitHub">
                        <i class="devicon-github-original"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/mohamed-assem-316618217/" target="_blank" class="protocol-link linkedin" data-tool="LinkedIn">
                        <i class="devicon-linkedin-plain"></i>
                    </a>
                    <a href="https://codeforces.com/profile/AsemoGG" target="_blank" class="protocol-link codeforces" data-tool="Codeforces">
                        <i class="fa-solid fa-trophy"></i>
                    </a>
                </div>
            </section>

            <footer class="card-footer">
                <div class="cmd-line">
                    <span class="prompt">judge22@system:~$</span>
                    <span id="cmdInput" class="typer"></span>
                    <span class="cursor">_</span>
                </div>
                <div id="terminalOutput" class="terminal-log hidden"></div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
